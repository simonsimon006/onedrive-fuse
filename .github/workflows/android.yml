name: Android

on:
  push:
    paths:
      - "android-sftp-saf/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-sftp-saf/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-sftp-saf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android action: the runner image already ships the SDK with its
      # licences accepted, and the action's `tools` package no longer exists.
      - name: Show SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sftp-saf-debug-apk
          path: android-sftp-saf/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
